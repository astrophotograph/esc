[project]
name = "eesc-python"
version = "0.1.0"
description = "Python modules for EESC telescope control application"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "astropy>=6.1.0",
    "astroplan>=0.10.0",
    "numpy>=2.1.0",
    "pyerfa>=2.0.1.4",
    # Telescope control
    "scopinator>=2025.9.13",
    # Image processing
    "opencv-python>=4.11.0.86",
    "scikit-image>=0.25.2",
    "pillow>=11.2.1",
    # Async support
    "aiosqlite>=0.21.0",
    "httpx>=0.28.1",
    "nest-asyncio>=1.6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "PT"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.hatch.build.targets.wheel]
packages = ["src-tauri/python"]

# [tool.uv.sources]
# scopinator = { path = "../pyscopinator/dist/scopinator-2026.1.26.tar.gz" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

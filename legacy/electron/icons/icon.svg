<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a3e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a9eff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bgGradient)"/>
  
  <!-- Outer ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#4a9eff" stroke-width="2" opacity="0.3"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="#4a9eff" stroke-width="1" opacity="0.5"/>
  
  <!-- ESC Text -->
  <text x="256" y="290" font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="140" font-weight="bold" text-anchor="middle" fill="url(#textGradient)">ESC</text>
  
  <!-- Decorative elements -->
  <circle cx="256" cy="100" r="3" fill="#00d4ff" opacity="0.8"/>
  <circle cx="256" cy="412" r="3" fill="#00d4ff" opacity="0.8"/>
  <circle cx="100" cy="256" r="3" fill="#4a9eff" opacity="0.8"/>
  <circle cx="412" cy="256" r="3" fill="#4a9eff" opacity="0.8"/>
  
  <!-- Corner stars -->
  <g opacity="0.6">
    <circle cx="120" cy="120" r="2" fill="white"/>
    <circle cx="392" cy="120" r="2" fill="white"/>
    <circle cx="120" cy="392" r="2" fill="white"/>
    <circle cx="392" cy="392" r="2" fill="white"/>
  </g>
</svg>
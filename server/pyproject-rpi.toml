[project]
name = "smarttel"
version = "0.1.0"
description = "Telescope control server for Seestar - Raspberry Pi version"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy<2.0.0",  # NumPy 1.x for RPi4 compatibility
    "argon2-cffi-bindings==21.2.0",  # Pin to version with armv7l support
    "charset-normalizer==3.4.2",  # Pin to version with armv7l support
    "typer[all]>=0.10.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.5.0",
    "pillow>=10.4.0",
    "httpx>=0.25.0",
    "scipy>=1.11.0,<1.14.0",  # Compatible with numpy 1.x
    "scikit-image>=0.21.0,<0.23.0",  # Compatible with numpy 1.x
    "sse-starlette>=2.0.0",
    "textual>=0.83.0",
    "websockets>=12.0",
    "psutil>=6.0.0",
    "pyserial>=3.5",
    "pydantic-settings>=2.3.4",
    "requests>=2.32.3",
    "pyudev>=0.24.3",
    "evdev>=1.7.1",
    "scopinator @ git+https://github.com/astrophotograph/pyscopinator.git@main", 
    "aiofiles>=23.2.1",
    "watchdog>=4.0.1",
    "astroplan>=0.10",
    "astropy>=6.1.2",
    "astroquery>=0.4.7",
    "cachetools>=5.4.0",
    "click>=8.1.7",
    "google-api-python-client>=2.138.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.1",
    "httplib2>=0.22.0",
    "iniconfig>=2.0.0",
    "ipython>=8.26.0",
    "matplotlib>=3.7.0,<3.9.0",  # Compatible with numpy 1.x
    "contourpy==1.3.2",  # Pin to version with armv7l support
    "packaging>=24.1",
    "platformdirs>=4.2.2",
    "pluggy>=1.5.0",
    "pyerfa>=2.0.1.4",
    "pytest>=8.3.2",
    "pytz>=2024.1",
    "pyvo>=1.5.2",
    "rerun-sdk>=0.20.3",
    "structlog>=24.4.0",
    "text-unidecode>=1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "black>=23.0.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.5.0",
    "ruff>=0.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["smarttel", "cli"]
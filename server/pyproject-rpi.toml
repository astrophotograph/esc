[project]
name = "smarttel"
version = "0.1.0"
description = "Telescope control server for Seestar - Raspberry Pi version"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core packages with specific versions for RPi4 ARMv7 compatibility
    "numpy==1.26.4",  # Last 1.x version with good ARMv7 support
    "argon2-cffi-bindings==21.2.0",
    "charset-normalizer==3.4.2",
    "cryptography==45.0.5",
    "cffi==1.17.1",
    "contourpy==1.3.2",
    
    # Web framework and async
    "fastapi==0.116.1",
    "fastapi-restful[all]==0.6.4",
    "uvicorn[standard]==0.34.3",
    "pydantic==2.11.7",
    "httpx[brotli,http2,zstd]==0.28.1",
    "websockets==15.0.1",
    "aiortc==1.13.0",
    "aiosqlite>=0.21.0",
    "async-timeout>=5.0.1",
    "sse-starlette>=2.0.0",
    
    # Image processing and scientific
    "pillow==11.3.0",
    "opencv-python==4.11.0.86",
    "scipy==1.13.1",  # Compatible with numpy 1.26
    "scikit-image==0.22.0",  # Compatible with numpy 1.26
    "matplotlib==3.8.4",  # Compatible with numpy 1.26
    
    # System and utilities
    "psutil==5.9.8",
    "click==8.1.9",
    "loguru>=0.7.3",
    "pydash>=8.0.5",
    "beartype>=0.21.0",
    "python-multipart>=0.0.20",
    "tzlocal>=5.3.1",
    "typer>=0.10.0",
    "textual>=0.83.0",
    
    # Additional dependencies
    "pyserial>=3.5",
    "pydantic-settings>=2.3.4",
    "requests>=2.32.3",
    "pyudev>=0.24.3",
    "evdev>=1.7.1",
    "scopinator>=2025.9.6",
    "aiofiles>=23.2.1",
    "watchdog>=4.0.1",
    
    # Astronomy packages
    "astroplan>=0.10",
    "astropy==7.1.0",
    "pyerfa==2.0.1.5",
    "astroquery>=0.4.7",
    "starplot>=0.9.0",
    "cachetools>=5.4.0",
    "google-api-python-client>=2.138.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.1",
    "httplib2>=0.22.0",
    "iniconfig>=2.0.0",
    "ipython>=8.26.0",
    "packaging>=24.1",
    "platformdirs>=4.2.2",
    "pluggy>=1.5.0",
    "pytest>=8.3.2",
    "pytz>=2024.1",
    "pyvo>=1.5.2",
    "rerun-sdk>=0.20.3",
    "structlog>=24.4.0",
    "text-unidecode>=1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "black>=23.0.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.5.0",
    "ruff>=0.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["smarttel", "cli"]
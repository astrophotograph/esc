[project]
name = "smarttel"
version = "0.1.0"
description = "Telescope control server for Seestar - Raspberry Pi version"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core constraints for RPi4 compatibility
    "numpy<2.0",  # Required for ARMv7 compatibility
    "opencv-python<4.11",  # Must be compatible with numpy<2.0
    
    # Let piwheels/PyPI resolve the rest automatically
    "aiosqlite>=0.21.0",
    "aiortc>=1.9.0",
    "async-timeout>=5.0.1",
    "beartype>=0.21.0",
    "click<8.2",
    "loguru>=0.7.3",
    "pydash>=8.0.5",
    "fastapi>=0.115.0",
    "fastapi-restful[all]>=0.6.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.5.0",
    "httpx[brotli,http2,zstd]>=0.25.0",
    "websockets>=12.0",
    "sse-starlette>=2.0.0",
    "python-multipart>=0.0.20",
    "tzlocal>=5.0.0",
    "typer>=0.10.0",
    "textual>=0.80.0",
    
    # Image processing and scientific - let resolver find compatible versions
    "pillow>=10.0.0",
    "scipy>=1.11.0",
    "scikit-image>=0.21.0",
    "matplotlib>=3.7.0",
    
    # System and utilities
    "psutil>=5.9.0,<6.0.0",  # fastapi-restful requires psutil<6
    "pyserial>=3.5",
    "pydantic-settings>=2.0.0",
    "requests>=2.30.0",
    "scopinator>=2025.9.6",
    "aiofiles>=23.0.0",
    "watchdog>=4.0.0",
    
    # Astronomy packages
    "astroplan>=0.10",
    "astropy>=6.0.0",
    "pyerfa>=2.0.0",
    "astroquery>=0.4.0",
    "starplot>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Dev dependencies removed for RPi - not needed for running the server
# and some (like ruff) don't have compatible wheels on piwheels
[tool.uv]
dev-dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["smarttel", "cli"]
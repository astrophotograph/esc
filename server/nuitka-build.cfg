# Nuitka Build Configuration for ESC Server
# This file contains build options for Nuitka

# Output configuration
--standalone
--output-dir=dist-nuitka
--output-filename=esc-server

# Enable useful plugins
--enable-plugin=anti-bloat
--enable-plugin=implicit-imports
--enable-plugin=pylint-warnings

# Follow all imports (safer but slower)
--follow-imports

# Include our packages
--include-package=api
--include-package=models
--include-package=services
--include-package=smarttel
--include-package=cli

# Include problematic modules explicitly  
--include-module=tzlocal
--include-module=pydash

# Uvicorn modules
--include-module=uvicorn.workers
--include-module=uvicorn.protocols.http.h11_impl
--include-module=uvicorn.protocols.http.httptools_impl  
--include-module=uvicorn.protocols.websockets.websockets_impl
--include-module=uvicorn.lifespan.on
--include-module=uvicorn.loops.auto
--include-module=uvicorn.loops.asyncio
--include-module=uvicorn.loops.uvloop
--include-module=uvicorn.logging

# Include data directories
--include-data-dir=./data=data

# Show progress
--show-progress
--show-memory

# Assume yes for downloads
--assume-yes-for-downloads

# macOS specific options
--macos-create-app-bundle
--macos-app-name=ESC-Server

# Disable console on Windows (uncomment if needed)
# --windows-disable-console

# Company info (optional)
--company-name=ESC
--product-name=ESC-Server
--file-version=1.0.0.0
--product-version=1.0.0.0
--file-description="ESC Telescope Control Server"

# Main script (specified on command line)
# main.py
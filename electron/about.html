<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>About ESC</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }
        
        .container {
            text-align: center;
            padding: 40px;
            animation: fadeIn 0.5s ease-in;
            position: relative;
            z-index: 10;
        }
        
        .logo {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        
        h1 {
            font-size: 36px;
            font-weight: 300;
            margin: 0 0 10px 0;
            letter-spacing: 3px;
        }
        
        .version {
            font-size: 14px;
            opacity: 0.7;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }
        
        .description {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 30px;
            max-width: 400px;
            line-height: 1.5;
        }
        
        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .link-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        .link-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #ffffff;
            text-decoration: none;
            font-size: 13px;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .link-button:hover {
            background: rgba(74, 158, 255, 0.3);
            border-color: #4a9eff;
            transform: translateY(-2px);
        }
        
        .link-button svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }
        
        .support-section {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 20px;
            margin-top: 20px;
        }
        
        .support-title {
            font-size: 12px;
            opacity: 0.6;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .copyright {
            font-size: 11px;
            opacity: 0.5;
            margin-top: 30px;
        }
        
        .close-button {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 30px;
            height: 30px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .close-button:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.9; }
        }
    </style>
</head>
<body>

    <script>
        // Open external links using IPC
        function openExternal(url) {
            // Use the Electron IPC to open external links
            if (window.electronAPI && window.electronAPI.openExternal) {
                window.electronAPI.openExternal(url);
            } else {
                // Try using window.open as fallback
                window.open(url, '_blank');
            }
        }
        
        // Set version from IPC message
        window.addEventListener('DOMContentLoaded', () => {
            // Listen for app version from main process
            if (window.electronAPI && window.electronAPI.onAppVersion) {
                window.electronAPI.onAppVersion((version) => {
                    document.getElementById('version').textContent = version;
                });
            } else {
                document.getElementById('version').textContent = '1.0.0';
            }
        });
        
        // Close on Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                window.close();
            }
        });
    </script>

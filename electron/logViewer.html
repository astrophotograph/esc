<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Log Viewer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Roboto Mono', Consolas, 'Courier New', monospace;
            background: #1e1e1e;
            color: #d4d4d4;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        
        .header {
            background: #2d2d30;
            padding: 10px 20px;
            border-bottom: 1px solid #3e3e42;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        
        .title {
            font-size: 14px;
            font-weight: 500;
            color: #cccccc;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .control-group {
            display: flex;
            gap: 5px;
            align-items: center;
        }
        
        #levelFilters {
            border-right: 1px solid #3e3e42;
            padding-right: 15px;
            margin-right: 10px;
        }
        
        #levelFilters label {
            margin: 0 8px;
        }
        
        .level-filter {
            cursor: pointer;
        }
        
        button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 5px 15px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            font-family: inherit;
        }
        
        button:hover {
            background: #1177bb;
        }
        
        button:active {
            background: #0d5a8f;
        }
        
        button:disabled {
            background: #3e3e42;
            color: #6e6e6e;
            cursor: not-allowed;
        }
        
        input[type="text"] {
            background: #3c3c3c;
            border: 1px solid #3e3e42;
            color: #cccccc;
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 12px;
            font-family: inherit;
            width: 200px;
        }
        
        input[type="checkbox"] {
            margin-right: 5px;
        }
        
        label {
            font-size: 12px;
            color: #cccccc;
            cursor: pointer;
            display: flex;
            align-items: center;
        }
        
        .log-container {
            flex: 1;
            overflow-y: auto;
            padding: 10px 20px;
            font-size: 12px;
            line-height: 1.5;
        }
        
        .log-entry {
            margin: 2px 0;
            padding: 2px 0;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        /* Log level colors */
        .debug {
            color: #858585;
        }
        
        .info {
            color: #d4d4d4;
        }
        
        .warning {
            color: #dcdcaa;
            background: rgba(220, 220, 170, 0.1);
        }
        
        .error {
            color: #f48771;
            background: rgba(244, 135, 113, 0.1);
        }
        
        .critical {
            color: #ffffff;
            background: rgba(255, 0, 0, 0.2);
            font-weight: bold;
        }
        
        /* Syntax highlighting for common patterns */
        .timestamp {
            color: #608b4e;
        }
        
        .module {
            color: #4ec9b0;
        }
        
        .highlight {
            background: rgba(255, 235, 59, 0.2);
        }
        
        .status-bar {
            background: #007acc;
            color: white;
            padding: 5px 20px;
            font-size: 11px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        
        .status-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 12px;
        }
        
        ::-webkit-scrollbar-track {
            background: #1e1e1e;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #424242;
            border-radius: 6px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #4e4e4e;
        }
        
        .no-logs {
            color: #6e6e6e;
            font-style: italic;
            text-align: center;
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title" id="logTitle">Server Logs</div>
        <div class="controls">
            <div class="control-group" id="levelFilters" style="display: none;">
                <label style="margin-right: 10px; font-weight: 500;">Levels:</label>
                <label>
                    <input type="checkbox" class="level-filter" data-level="debug">
                    Debug
                </label>
                <label>
                    <input type="checkbox" class="level-filter" data-level="info" checked>
                    Info
                </label>
                <label>
                    <input type="checkbox" class="level-filter" data-level="warning" checked>
                    Warning
                </label>
                <label>
                    <input type="checkbox" class="level-filter" data-level="error" checked>
                    Error
                </label>
                <label>
                    <input type="checkbox" class="level-filter" data-level="critical" checked>
                    Critical
                </label>
            </div>
            <div class="control-group">
                <input type="text" id="searchInput" placeholder="Search logs...">
            </div>
            <div class="control-group">
                <label>
                    <input type="checkbox" id="autoScroll" checked>
                    Auto-scroll
                </label>
            </div>
            <div class="control-group">
                <label>
                    <input type="checkbox" id="wordWrap" checked>
                    Wrap lines
                </label>
            </div>
            <div class="control-group">
                <button id="clearBtn">Clear</button>
                <button id="exportBtn">Export</button>
            </div>
        </div>
    </div>
    
    <div class="log-container" id="logContainer">
        <div class="no-logs">Waiting for logs...</div>
    </div>
    
    <div class="status-bar">
        <div class="status-item">
            <span id="lineCount">0 lines</span>
            <span>|</span>
            <span id="lastUpdate">Never updated</span>
        </div>
        <div class="status-item">
            <span id="connectionStatus">Connected</span>
        </div>
    </div>
    
    <script>
        const { ipcRenderer } = require('electron');
        
        // Get log type from URL params
        const params = new URLSearchParams(window.location.search);
        const logType = params.get('type') || 'backend';
        
        // Update title
        document.getElementById('logTitle').textContent = 
            logType === 'backend' ? 'Backend Server Logs' : 'Frontend Server Logs';
        
        // Show level filters only for backend logs
        if (logType === 'backend') {
            document.getElementById('levelFilters').style.display = 'flex';
        }
        
        // Elements
        const logContainer = document.getElementById('logContainer');
        const searchInput = document.getElementById('searchInput');
        const autoScrollCheckbox = document.getElementById('autoScroll');
        const wordWrapCheckbox = document.getElementById('wordWrap');
        const clearBtn = document.getElementById('clearBtn');
        const exportBtn = document.getElementById('exportBtn');
        const lineCountSpan = document.getElementById('lineCount');
        const lastUpdateSpan = document.getElementById('lastUpdate');
        
        let logs = [];
        let filteredLogs = [];
        let autoScroll = true;
        let activeLevels = new Set(['info', 'warning', 'error', 'critical']); // DEBUG unchecked by default
        
        // Parse log level from text
        function getLogLevel(text) {
            // For backend logs with the format: "2025-08-23 19:56:23.022 | INFO     | module:function:line | message"
            const match = text.match(/\|\s*(DEBUG|INFO|WARNING|ERROR|CRITICAL)\s*\|/);
            if (match) {
                return match[1].toLowerCase();
            }
            
            // Fallback to searching for keywords
            if (/\bDEBUG\b/i.test(text)) return 'debug';
            if (/\bWARN(ING)?\b/i.test(text)) return 'warning';
            if (/\bERROR\b/i.test(text)) return 'error';
            if (/\bCRITICAL\b/i.test(text)) return 'critical';
            if (/\bINFO\b/i.test(text)) return 'info';
            return 'info';
        }
        
        // Format log entry with syntax highlighting
        function formatLogEntry(text) {
            // Escape HTML
            text = text.replace(/&/g, '&amp;')
                      .replace(/</g, '&lt;')
                      .replace(/>/g, '&gt;');
            
            // Highlight timestamps
            text = text.replace(/\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}[\.,]\d{3}/g, 
                              '<span class="timestamp">$&</span>');
            
            // Highlight module names (Python style)
            text = text.replace(/\b([a-z_]+\.[a-z_]+):/g, 
                              '<span class="module">$1</span>:');
            
            return text;
        }
        
        // Add log entry to display
        function addLogEntry(text, skipFilter = false) {
            const level = getLogLevel(text);
            
            // Store the raw log entry
            const entry = document.createElement('div');
            entry.className = `log-entry ${level}`;
            entry.innerHTML = formatLogEntry(text);
            entry.dataset.level = level;
            entry.dataset.text = text;
            
            // Check if this level should be shown
            if (!skipFilter && !activeLevels.has(level)) {
                entry.style.display = 'none';
            }
            
            // Remove "no logs" message if present
            const noLogs = logContainer.querySelector('.no-logs');
            if (noLogs) {
                noLogs.remove();
            }
            
            logContainer.appendChild(entry);
            
            if (autoScroll && entry.style.display !== 'none') {
                logContainer.scrollTop = logContainer.scrollHeight;
            }
            
            updateStatus();
        }
        
        // Update status bar
        function updateStatus(visibleCount = null) {
            const entries = logContainer.querySelectorAll('.log-entry');
            const visible = visibleCount !== null ? visibleCount : 
                Array.from(entries).filter(e => e.style.display !== 'none').length;
            
            if (visible < entries.length) {
                lineCountSpan.textContent = `${visible} of ${entries.length} lines`;
            } else {
                lineCountSpan.textContent = `${entries.length} lines`;
            }
            lastUpdateSpan.textContent = new Date().toLocaleTimeString();
        }
        
        // Filter logs by search and level
        function filterLogs() {
            const searchTerm = searchInput.value.toLowerCase();
            const entries = logContainer.querySelectorAll('.log-entry');
            let visibleCount = 0;
            
            entries.forEach(entry => {
                const level = entry.dataset.level;
                const text = entry.dataset.text || entry.textContent;
                const matchesSearch = searchTerm === '' || text.toLowerCase().includes(searchTerm);
                const matchesLevel = activeLevels.has(level);
                
                if (matchesSearch && matchesLevel) {
                    entry.style.display = '';
                    visibleCount++;
                    
                    // Re-format the entry to remove old highlights
                    entry.innerHTML = formatLogEntry(text);
                    
                    // Highlight search term
                    if (searchTerm) {
                        entry.innerHTML = entry.innerHTML.replace(
                            new RegExp(`(${searchTerm})`, 'gi'),
                            '<span class="highlight">$1</span>'
                        );
                    }
                } else {
                    entry.style.display = 'none';
                }
            });
            
            // Update status to show filtered count
            updateStatus(visibleCount);
        }
        
        // Clear logs
        function clearLogs() {
            logContainer.innerHTML = '<div class="no-logs">Logs cleared. Waiting for new logs...</div>';
            logs = [];
            updateStatus();
        }
        
        // Export logs
        function exportLogs() {
            const entries = logContainer.querySelectorAll('.log-entry');
            const logText = Array.from(entries)
                .map(entry => entry.textContent)
                .join('\n');
            
            const blob = new Blob([logText], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${logType}-logs-${Date.now()}.txt`;
            a.click();
            URL.revokeObjectURL(url);
        }
        
        // Event listeners
        autoScrollCheckbox.addEventListener('change', (e) => {
            autoScroll = e.target.checked;
            if (autoScroll) {
                logContainer.scrollTop = logContainer.scrollHeight;
            }
        });
        
        wordWrapCheckbox.addEventListener('change', (e) => {
            const entries = logContainer.querySelectorAll('.log-entry');
            entries.forEach(entry => {
                entry.style.whiteSpace = e.target.checked ? 'pre-wrap' : 'pre';
            });
        });
        
        searchInput.addEventListener('input', filterLogs);
        clearBtn.addEventListener('click', clearLogs);
        exportBtn.addEventListener('click', exportLogs);
        
        // Level filter event listeners
        document.querySelectorAll('.level-filter').forEach(checkbox => {
            checkbox.addEventListener('change', (e) => {
                const level = e.target.dataset.level;
                if (e.target.checked) {
                    activeLevels.add(level);
                } else {
                    activeLevels.delete(level);
                }
                filterLogs();
            });
        });
        
        // Listen for log data from main process
        ipcRenderer.on('log-data', (event, data) => {
            if (data.type === logType) {
                // Split by newlines and add each line
                const lines = data.text.split('\n').filter(line => line.trim());
                lines.forEach(line => {
                    logs.push(line);
                    addLogEntry(line, false); // Apply filters
                });
            }
        });
        
        // Request initial logs
        ipcRenderer.send('request-logs', { type: logType });
        
        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            // Ctrl/Cmd + F to focus search
            if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
                e.preventDefault();
                searchInput.focus();
            }
            // Ctrl/Cmd + L to clear
            if ((e.ctrlKey || e.metaKey) && e.key === 'l') {
                e.preventDefault();
                clearLogs();
            }
            // Escape to clear search
            if (e.key === 'Escape' && searchInput.value) {
                searchInput.value = '';
                filterLogs();
            }
        });
    </script>
</body>
</html>

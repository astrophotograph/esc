<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ESC - Loading</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        
        .container {
            text-align: center;
            animation: fadeIn 0.5s ease-in;
        }
        
        .logo {
            width: 120px;
            height: 120px;
            margin-bottom: 30px;
            animation: pulse 2s infinite;
        }
        
        h1 {
            font-size: 48px;
            font-weight: 300;
            margin: 0 0 10px 0;
            letter-spacing: 4px;
        }
        
        .subtitle {
            font-size: 14px;
            opacity: 0.7;
            margin-bottom: 40px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        
        .loader {
            width: 200px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            margin: 0 auto 20px;
        }
        
        .loader-bar {
            height: 100%;
            background: linear-gradient(90deg, #4a9eff, #00d4ff);
            border-radius: 2px;
            animation: loading 2s ease-in-out infinite;
        }
        
        .status {
            font-size: 12px;
            opacity: 0.5;
            margin-top: 10px;
            height: 20px;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.9; }
        }
        
        @keyframes loading {
            0% { transform: translateX(-100%); }
            50% { transform: translateX(0); }
            100% { transform: translateX(100%); }
        }
        
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }
        
        @keyframes twinkle {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    <div class="container">
        <svg class="logo" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
            <circle cx="60" cy="60" r="50" fill="none" stroke="#4a9eff" stroke-width="2" opacity="0.3"/>
            <circle cx="60" cy="60" r="40" fill="none" stroke="#4a9eff" stroke-width="1" opacity="0.5"/>
            <circle cx="60" cy="60" r="30" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.7"/>
            <circle cx="60" cy="60" r="20" fill="none" stroke="#00d4ff" stroke-width="2"/>
            <circle cx="60" cy="60" r="5" fill="#ffffff"/>
            <path d="M60,10 L60,110 M10,60 L110,60" stroke="#4a9eff" stroke-width="0.5" opacity="0.3"/>
        </svg>
        <h1>ESC</h1>
        <div class="subtitle">Telescope Control System</div>
        <div class="loader">
            <div class="loader-bar"></div>
        </div>
        <div class="status" id="status">Initializing application...</div>
    </div>
    
    <script>
        // Create random stars
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 50; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 3 + 's';
            starsContainer.appendChild(star);
        }
        
        // Update status messages
        const statusElement = document.getElementById('status');
        const messages = [
            'Initializing application...',
            'Starting backend services...',
            'Loading telescope drivers...',
            'Preparing user interface...',
            'Connecting to services...'
        ];
        let messageIndex = 0;
        
        setInterval(() => {
            messageIndex = (messageIndex + 1) % messages.length;
            statusElement.textContent = messages[messageIndex];
        }, 2000);
        
        // Listen for IPC messages from main process
        if (window.electronAPI) {
            window.electronAPI.onLoadingStatus((status) => {
                statusElement.textContent = status;
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ESC - Loading</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        
        .container {
            text-align: center;
            animation: fadeIn 0.5s ease-in;
        }
        
        .logo {
            width: 120px;
            height: 120px;
            margin-bottom: 30px;
            animation: pulse 2s infinite;
        }
        
        h1 {
            font-size: 48px;
            font-weight: 300;
            margin: 0 0 10px 0;
            letter-spacing: 4px;
        }
        
        .subtitle {
            font-size: 14px;
            opacity: 0.7;
            margin-bottom: 40px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        
        .loader {
            width: 200px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            margin: 0 auto 20px;
        }
        
        .loader-bar {
            height: 100%;
            background: linear-gradient(90deg, #4a9eff, #00d4ff);
            border-radius: 2px;
            animation: loading 2s ease-in-out infinite;
        }
        
        .status {
            font-size: 12px;
            opacity: 0.5;
            margin-top: 10px;
            height: 20px;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.9; }
        }
        
        @keyframes loading {
            0% { transform: translateX(-100%); }
            50% { transform: translateX(0); }
            100% { transform: translateX(100%); }
        }
        
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }
        
        @keyframes twinkle {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    <div class="container">
        <svg class="logo" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
            <circle cx="60" cy="60" r="50" fill="none" stroke="#4a9eff" stroke-width="2" opacity="0.3"/>
            <circle cx="60" cy="60" r="40" fill="none" stroke="#4a9eff" stroke-width="1" opacity="0.5"/>
            <circle cx="60" cy="60" r="30" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.7"/>
            <circle cx="60" cy="60" r="20" fill="none" stroke="#00d4ff" stroke-width="2"/>
            <circle cx="60" cy="60" r="5" fill="#ffffff"/>
            <path d="M60,10 L60,110 M10,60 L110,60" stroke="#4a9eff" stroke-width="0.5" opacity="0.3"/>
        </svg>
        <h1>ESC</h1>
        <div class="subtitle">Telescope Control System</div>
        <div class="loader">
            <div class="loader-bar"></div>
        </div>
        <div class="status" id="status">Initializing application...</div>
        <div style="margin-top: 10px;">
            <button id="toggle-logs" onclick="toggleLogs()" style="padding: 4px 8px; background: rgba(255,255,255,0.1); color: #999; border: 1px solid rgba(255,255,255,0.2); border-radius: 3px; cursor: pointer; font-size: 11px; display: none;">Show Logs ▼</button>
        </div>
        <div id="progress-log" style="margin-top: 10px; max-height: 100px; overflow-y: auto; font-size: 10px; color: #999; text-align: left; padding: 10px; background: rgba(0,0,0,0.3); border-radius: 5px; display: none;"></div>
        <div id="error-container" style="display: none; margin-top: 20px;">
            <div style="color: #ff4444; margin-bottom: 10px; font-size: 14px; white-space: pre-line;" id="error-message"></div>
            <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;" id="error-buttons">
                <button onclick="retryStart()" style="padding: 8px 16px; background: #4a9eff; color: white; border: none; border-radius: 4px; cursor: pointer;">Retry</button>
                <button id="force-kill-btn" onclick="forceKillPorts()" style="padding: 8px 16px; background: #ff8800; color: white; border: none; border-radius: 4px; cursor: pointer; display: none;">Force Close Ports</button>
                <button onclick="viewLogs()" style="padding: 8px 16px; background: #666; color: white; border: none; border-radius: 4px; cursor: pointer;">View Logs</button>
                <button onclick="exitApp()" style="padding: 8px 16px; background: #ff4444; color: white; border: none; border-radius: 4px; cursor: pointer;">Exit</button>
            </div>
        </div>
    </div>
    
    <script>
        // Create random stars
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 50; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 3 + 's';
            starsContainer.appendChild(star);
        }
        
        // Status and progress tracking
        const statusElement = document.getElementById('status');
        const progressLog = document.getElementById('progress-log');
        const errorContainer = document.getElementById('error-container');
        const errorMessage = document.getElementById('error-message');
        let progressMessages = [];
        let hasError = false;
        let startTime = Date.now();
        let timeoutTimer = null;
        let logsExpanded = false;
        
        // Set a timeout for loading (90 seconds)
        function startTimeout() {
            clearTimeout(timeoutTimer);
            timeoutTimer = setTimeout(() => {
                if (!hasError) {
                    const elapsed = Math.round((Date.now() - startTime) / 1000);
                    showError(`Application startup timed out after ${elapsed} seconds. The servers may have failed to start.`);
                }
            }, 90000);
        }
        
        // Start the timeout when page loads
        startTimeout();
        
        function toggleLogs() {
            const toggleBtn = document.getElementById('toggle-logs');
            logsExpanded = !logsExpanded;
            
            if (logsExpanded) {
                progressLog.style.display = 'block';
                toggleBtn.textContent = 'Hide Logs ▲';
            } else {
                progressLog.style.display = 'none';
                toggleBtn.textContent = 'Show Logs ▼';
            }
        }
        
        function parseServerLog(msg) {
            // Try to parse JSON logs from the server
            try {
                // Look for JSON structure in the message
                const jsonMatch = msg.match(/\{.*\}/);
                if (jsonMatch) {
                    const jsonData = JSON.parse(jsonMatch[0]);
                    
                    // Extract meaningful messages from JSON logs
                    if (jsonData.message) {
                        // Clean up common server messages
                        let cleanMsg = jsonData.message;
                        
                        // Update main status for important messages
                        if (cleanMsg.includes('Starting') || 
                            cleanMsg.includes('WebSocket manager started') ||
                            cleanMsg.includes('Database initialized') ||
                            cleanMsg.includes('Application startup complete')) {
                            statusElement.textContent = cleanMsg;
                        }
                        
                        return cleanMsg;
                    } else if (jsonData.event) {
                        // Handle event-based messages
                        switch(jsonData.event) {
                            case 'server_started':
                                statusElement.textContent = 'Backend server started successfully';
                                return 'Server started';
                            case 'startup_complete':
                                statusElement.textContent = 'Application startup complete';
                                return 'Startup complete';
                            default:
                                return jsonData.event;
                        }
                    }
                }
            } catch (e) {
                // Not JSON or parsing failed, use original message
            }
            
            // For non-JSON messages, clean up common patterns
            let cleanMsg = msg;
            
            // Remove timestamps
            cleanMsg = cleanMsg.replace(/\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d+\s*\|\s*/g, '');
            
            // Remove log levels
            cleanMsg = cleanMsg.replace(/^(INFO|DEBUG|WARNING|ERROR)\s*\|\s*/i, '');
            
            // Update status for key messages
            if (cleanMsg.includes('Uvicorn running on') || 
                cleanMsg.includes('Server starting on')) {
                statusElement.textContent = 'Backend server is running';
            } else if (cleanMsg.includes('WebSocket manager started')) {
                statusElement.textContent = 'WebSocket connections ready';
            } else if (cleanMsg.includes('Discovering')) {
                statusElement.textContent = 'Discovering telescopes on network...';
            } else if (cleanMsg.includes('Frontend server is ready')) {
                statusElement.textContent = 'User interface ready';
            }
            
            return cleanMsg.trim();
        }
        
        function addProgressMessage(msg) {
            // Parse the message for better display
            const parsedMsg = parseServerLog(msg);
            
            progressMessages.push(parsedMsg);
            if (progressMessages.length > 20) {
                progressMessages.shift();
            }
            progressLog.innerHTML = progressMessages.join('<br>');
            
            // Show the toggle button once we have messages
            document.getElementById('toggle-logs').style.display = 'inline-block';
            
            if (logsExpanded) {
                progressLog.scrollTop = progressLog.scrollHeight;
            }
        }
        
        function showError(error) {
            hasError = true;
            errorMessage.textContent = error;
            errorContainer.style.display = 'block';
            document.querySelector('.loader').style.display = 'none';
            
            // Show force kill button if it's a port conflict error
            const forceKillBtn = document.getElementById('force-kill-btn');
            if (error.includes('ports are already in use') || error.includes('Port') && error.includes('already in use')) {
                forceKillBtn.style.display = 'inline-block';
            } else {
                forceKillBtn.style.display = 'none';
            }
        }
        
        function retryStart() {
            if (window.electronAPI) {
                window.electronAPI.retryStart();
                errorContainer.style.display = 'none';
                document.querySelector('.loader').style.display = 'block';
                hasError = false;
                progressMessages = [];
                progressLog.innerHTML = '';
                statusElement.textContent = 'Retrying...';
                startTime = Date.now();
                startTimeout(); // Reset the timeout
            }
        }
        
        function viewLogs() {
            console.log('View logs button clicked');
            if (window.electronAPI) {
                console.log('Calling electronAPI.viewLogs()');
                window.electronAPI.viewLogs();
            } else {
                console.error('electronAPI not available');
            }
        }
        
        function exitApp() {
            console.log('Exit button clicked');
            if (window.electronAPI) {
                console.log('Calling electronAPI.exitApp()');
                window.electronAPI.exitApp();
            } else {
                console.error('electronAPI not available');
            }
        }
        
        function forceKillPorts() {
            console.log('Force kill ports button clicked');
            if (window.electronAPI) {
                console.log('Calling electronAPI.forceKillPorts()');
                window.electronAPI.forceKillPorts();
                errorContainer.style.display = 'none';
                document.querySelector('.loader').style.display = 'block';
                hasError = false;
                progressMessages = [];
                progressLog.innerHTML = '';
                statusElement.textContent = 'Force closing ports and retrying...';
                startTime = Date.now();
                startTimeout(); // Reset the timeout
            } else {
                console.error('electronAPI not available');
            }
        }
        
        // Check if electronAPI is available
        console.log('Checking for electronAPI:', typeof window.electronAPI);
        if (window.electronAPI) {
            console.log('electronAPI found, methods:', Object.keys(window.electronAPI));
        } else {
            console.error('electronAPI NOT FOUND - preload script may not be loaded');
            // Try to show this error to user
            setTimeout(() => {
                if (!window.electronAPI) {
                    showError('Application initialization error: IPC not available. Please restart the application.');
                }
            }, 2000);
        }
        
        // Listen for IPC messages from main process
        if (window.electronAPI) {
            window.electronAPI.onLoadingStatus((status) => {
                if (!hasError) {
                    statusElement.textContent = status;
                }
            });
            
            window.electronAPI.onLoadingProgress((progress) => {
                if (!hasError) {
                    addProgressMessage(progress);
                }
            });
            
            window.electronAPI.onLoadingError((error) => {
                showError(error);
            });
        }
    </script>
</body>
</html>

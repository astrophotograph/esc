[package]
name = "eesc"
version = "0.1.0"
description = "Telescope control application"
authors = ["erewhon"]
license = "AGPL-3.0-or-later"
repository = ""
edition = "2021"

[lib]
name = "eesc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "eesc"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["devtools"] }
tauri-plugin-shell = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
# Telescope protocol
scopinator-seestar = "0.1"
scopinator-types = "0.1"


# Image processing (stretch pipeline)
image = "0.25"
rayon = "1"
fitrs = "0.5"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# HTTP/Video streaming
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "cors"] }

# Async utilities
futures = "0.3"
async-trait = "0.1"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# State management
parking_lot = "0.12"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# UUID generation
uuid = { version = "1.0", features = ["v4", "serde"] }

# SSH tunneling (TODO: re-add when russh RC crypto deps stabilize)
# russh = "0.60"

name: Release Electron Apps

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'beta'
        type: choice
        options:
          - beta
          - release
          - test
      platforms:
        description: 'Platforms to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - mac-only
          - windows-only
      create_release:
        description: 'Create GitHub release'
        required: true
        default: false
        type: boolean

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate version and tag
        id: version
        run: |
          VERSION=$(node -p "require('./ui/package.json').version")
          DATE=$(date +%Y%m%d-%H%M%S)
          
          if [ "${{ github.event.inputs.release_type }}" == "release" ]; then
            TAG="v${VERSION}"
          elif [ "${{ github.event.inputs.release_type }}" == "test" ]; then
            TAG="test-${DATE}"
          else
            TAG="beta-${VERSION}-${DATE}"
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "📦 Version: $VERSION"
          echo "🏷️ Tag: $TAG"

  build-all:
    name: Build All Components
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}
      
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: ui/pnpm-lock.yaml
      
      - name: Sync versions
        run: node scripts/sync-electron-version.js
      
      - name: Build UI
        working-directory: ui
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      
      - name: Create UI artifact
        run: |
          tar -czf ui-build.tar.gz -C ui .next/standalone .next/static
      
      - name: Upload UI build
        uses: actions/upload-artifact@v4
        with:
          name: ui-build
          path: ui-build.tar.gz
          retention-days: 7

  build-mac:
    name: Build Mac App
    runs-on: [self-hosted, macOS]
    needs: [prepare, build-all]
    if: github.event.inputs.platforms == 'all' || github.event.inputs.platforms == 'mac-only'
    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}
      
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Download and extract UI build
        run: |
          curl -L -o ui-build.tar.gz "${{ github.server_url }}/${{ github.repository }}/actions/artifacts/$(gh api repos/${{ github.repository }}/actions/artifacts --jq '.artifacts[] | select(.name == "ui-build") | .id')/zip"
          tar -xzf ui-build.tar.gz -C ui/
      
      - name: Sync Electron version
        run: node scripts/sync-electron-version.js
      
      - name: Install Electron dependencies
        working-directory: electron
        run: |
          if [ ! -f "package.json" ]; then
            echo "Error: package.json not found in electron directory"
            ls -la
            exit 1
          fi
          pnpm install --frozen-lockfile
      
      - name: Build Electron Mac app
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: pnpm run build:mac
      
      - name: Package Mac apps
        run: |
          cd electron/dist
          # Create DMG for Intel
          if [ -d "mac" ]; then
            hdiutil create -volname "ESC" -srcfolder mac -ov -format UDZO "ESC-${{ needs.prepare.outputs.version }}-x64.dmg"
          fi
          # Create DMG for Apple Silicon
          if [ -d "mac-arm64" ]; then
            hdiutil create -volname "ESC" -srcfolder mac-arm64 -ov -format UDZO "ESC-${{ needs.prepare.outputs.version }}-arm64.dmg"
          fi
      
      - name: Upload Mac builds
        uses: actions/upload-artifact@v4
        with:
          name: mac-builds-${{ needs.prepare.outputs.version }}
          path: |
            electron/dist/*.dmg
          retention-days: 30

  build-windows:
    name: Build Windows App
    runs-on: windows-latest
    needs: [prepare, build-all]
    if: github.event.inputs.platforms == 'all' || github.event.inputs.platforms == 'windows-only'
    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}
      
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Download UI build
        uses: actions/download-artifact@v4
        with:
          name: ui-build
      
      - name: Extract UI build
        shell: pwsh
        run: |
          tar -xzf ui-build.tar.gz -C ui/
      
      - name: Sync Electron version
        run: node scripts/sync-electron-version.js
      
      - name: Build Python backend
        working-directory: server
        shell: pwsh
        run: |
          pip install uv
          uv pip install --system pyinstaller
          uv run pyinstaller --onefile --name main main.py
          
      - name: Prepare Python bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path electron/python-bundle
          Copy-Item server/dist/main.exe electron/python-bundle/
      
      - name: Install Electron dependencies
        working-directory: electron
        shell: pwsh
        run: |
          if (-not (Test-Path "package.json")) {
            Write-Error "package.json not found in electron directory"
            Get-ChildItem
            exit 1
          }
          pnpm install --frozen-lockfile
      
      - name: Build Electron Windows app
        working-directory: electron
        run: pnpm run build:win
      
      - name: Upload Windows builds
        uses: actions/upload-artifact@v4
        with:
          name: windows-builds-${{ needs.prepare.outputs.version }}
          path: |
            electron/dist/*.exe
            electron/dist/*.msi
          retention-days: 30

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare, build-mac, build-windows]
    if: github.event.inputs.create_release == 'true' && (success() || needs.build-mac.result == 'skipped' || needs.build-windows.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
      
      - name: Create release tag
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git tag ${{ needs.prepare.outputs.release_tag }}
          git push origin ${{ needs.prepare.outputs.release_tag }}
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: ESC ${{ needs.prepare.outputs.version }} (${{ github.event.inputs.release_type }})
          body: |
            # ESC Telescope Control Application
            
            **Version:** ${{ needs.prepare.outputs.version }}
            **Type:** ${{ github.event.inputs.release_type }}
            **Build Date:** ${{ github.run_started_at }}
            
            ## Downloads
            
            ### macOS
            - `ESC-${{ needs.prepare.outputs.version }}-x64.dmg` - Intel Macs
            - `ESC-${{ needs.prepare.outputs.version }}-arm64.dmg` - Apple Silicon Macs (M1/M2/M3)
            
            ### Windows
            - `ESC-Setup-${{ needs.prepare.outputs.version }}.exe` - Windows installer
            
            ## Installation Instructions
            
            ### macOS
            1. Download the appropriate .dmg file for your Mac
            2. Double-click to open the disk image
            3. Drag ESC to your Applications folder
            4. On first launch, right-click the app and select "Open" to bypass Gatekeeper
            
            ### Windows
            1. Download the .exe installer
            2. Run the installer as Administrator
            3. Follow the installation wizard
            4. Launch ESC from the Start Menu or Desktop shortcut
            
            ## System Requirements
            
            - **macOS:** 10.15 Catalina or later
            - **Windows:** Windows 10 version 1909 or later
            - **RAM:** 4GB minimum, 8GB recommended
            - **Network:** Active connection to Seestar telescope
            
            ## What's New
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
            
            ---
            *Built by GitHub Actions workflow run [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*
          files: |
            dist/mac-builds-*/*.dmg
            dist/windows-builds-*/*.exe
            dist/windows-builds-*/*.msi
          draft: ${{ github.event.inputs.release_type == 'test' }}
          prerelease: ${{ github.event.inputs.release_type != 'release' }}
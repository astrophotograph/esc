name: Build Electron Apps

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
      - 'build-*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_mac:
        description: 'Build Mac app'
        required: false
        default: true
        type: boolean
      build_windows:
        description: 'Build Windows app'
        required: false
        default: true
        type: boolean

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  prepare:
    name: Prepare Build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_build_mac: ${{ steps.check.outputs.build_mac }}
      should_build_windows: ${{ steps.check.outputs.build_windows }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Get version from UI package.json
        id: version
        run: |
          VERSION=$(node -p "require('./ui/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Version: $VERSION"
      
      - name: Check what to build
        id: check
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "build_mac=${{ github.event.inputs.build_mac }}" >> $GITHUB_OUTPUT
            echo "build_windows=${{ github.event.inputs.build_windows }}" >> $GITHUB_OUTPUT
          else
            echo "build_mac=true" >> $GITHUB_OUTPUT
            echo "build_windows=true" >> $GITHUB_OUTPUT
          fi

  build-ui:
    name: Build UI
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}
      
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: ui/pnpm-lock.yaml
      
      - name: Install UI dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile
      
      - name: Build UI
        working-directory: ui
        run: pnpm run build
      
      - name: Upload UI build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ui-build
          path: |
            ui/.next/standalone
            ui/.next/static
          retention-days: 1

  build-python:
    name: Build Python Backend
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      
      - name: Build Python backend with PyInstaller
        working-directory: server
        run: |
          uv pip install --system pyinstaller
          uv run pyinstaller --onefile --name main main.py
      
      - name: Upload Python build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-build
          path: server/dist/main
          retention-days: 1

  build-mac:
    name: Build Mac Electron App
    runs-on: [self-hosted, macOS]
    needs: [prepare, build-ui]
    if: needs.prepare.outputs.should_build_mac == 'true'
    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}
      
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Download UI build
        uses: actions/download-artifact@v4
        with:
          name: ui-build
          path: ui/
      
      - name: Sync Electron version
        run: node scripts/sync-electron-version.js
      
      - name: Install Electron dependencies
        working-directory: electron
        run: pnpm install --frozen-lockfile
      
      - name: Copy Python bundle (if exists)
        run: |
          if [ -d "electron/python-bundle" ]; then
            echo "Python bundle already exists"
          else
            echo "Python bundle not found, creating placeholder"
            mkdir -p electron/python-bundle
            echo "Python backend will be added during packaging" > electron/python-bundle/README.md
          fi
      
      - name: Build Mac app
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true
        run: pnpm run build:mac
      
      - name: Upload Mac artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-app-${{ needs.prepare.outputs.version }}
          path: |
            electron/dist/mac/*.app
            electron/dist/mac-arm64/*.app
          retention-days: 30

  build-windows:
    name: Build Windows Electron App
    runs-on: windows-latest
    needs: [prepare, build-ui]
    if: needs.prepare.outputs.should_build_windows == 'true'
    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}
      
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Download UI build
        uses: actions/download-artifact@v4
        with:
          name: ui-build
          path: ui/
      
      - name: Sync Electron version
        run: node scripts/sync-electron-version.js
      
      - name: Install Electron dependencies
        working-directory: electron
        run: pnpm install --frozen-lockfile
      
      - name: Build Python backend with PyInstaller
        working-directory: server
        shell: pwsh
        run: |
          pip install uv
          uv pip install --system pyinstaller
          uv run pyinstaller --onefile --name main main.py
          
      - name: Copy Python executable to electron
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path electron/python-bundle
          Copy-Item server/dist/main.exe electron/python-bundle/
      
      - name: Build Windows app
        working-directory: electron
        env:
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true
        run: pnpm run build:win
      
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-app-${{ needs.prepare.outputs.version }}
          path: |
            electron/dist/*.exe
            electron/dist/*.msi
          retention-days: 30

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [prepare, build-mac, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Mac artifacts
        uses: actions/download-artifact@v4
        with:
          name: mac-app-${{ needs.prepare.outputs.version }}
          path: dist/mac/
      
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-app-${{ needs.prepare.outputs.version }}
          path: dist/windows/
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: ESC v${{ needs.prepare.outputs.version }}
          body: |
            ## ESC Telescope Control Application
            
            Version: ${{ needs.prepare.outputs.version }}
            
            ### Downloads
            - **Mac**: ESC-${{ needs.prepare.outputs.version }}.dmg (Intel & Apple Silicon)
            - **Windows**: ESC-Setup-${{ needs.prepare.outputs.version }}.exe
            
            ### Installation
            
            #### Mac
            1. Download the .dmg file
            2. Open the downloaded file
            3. Drag ESC to your Applications folder
            4. On first launch, right-click and select "Open" to bypass Gatekeeper
            
            #### Windows
            1. Download the .exe installer
            2. Run the installer
            3. Follow the installation wizard
            
            ### Requirements
            - Mac: macOS 10.15 or later
            - Windows: Windows 10 or later
            - Active network connection to telescope
          files: |
            dist/mac/*
            dist/windows/*
          draft: false
          prerelease: ${{ contains(needs.prepare.outputs.version, 'beta') || contains(needs.prepare.outputs.version, 'alpha') }}
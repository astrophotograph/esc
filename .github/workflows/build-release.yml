name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'draft'
        type: choice
        options:
          - draft
          - prerelease
          - release

jobs:
  build-ui:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10
          
      - name: Cache UI dependencies
        uses: actions/cache@v4
        with:
          path: ui/node_modules
          key: ${{ runner.os }}-ui-${{ hashFiles('ui/pnpm-lock.yaml') }}
          
      - name: Install dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile
        
      - name: Build frontend
        working-directory: ui
        run: pnpm run build
        
      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: |
            ui/.next/standalone
            ui/.next/static

  build-python:
    name: Build Python Backend
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: linux
            artifact: python-linux
          - os: windows-latest
            platform: windows
            artifact: python-windows
          - os: macos-latest
            platform: macos
            artifact: python-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pyinstaller
          
      - name: Install uv (Unix)
        if: runner.os != 'Windows'
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          
      - name: Install uv (Windows)
        if: runner.os == 'Windows'
        run: |
          irm https://astral.sh/uv/install.ps1 | iex
          echo "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          
      - name: Install Python dependencies
        working-directory: server
        run: |
          uv sync
          
      - name: Build with PyInstaller (macOS)
        if: runner.os == 'macOS'
        working-directory: server
        run: |
          uv run pyinstaller --onefile --name esc-server --console --clean --noconfirm --add-data "data:data" --collect-all pydash --collect-all tzlocal --collect-all smarttel --hidden-import uvicorn.logging --hidden-import uvicorn.loops --hidden-import uvicorn.loops.auto --hidden-import uvicorn.protocols --hidden-import uvicorn.protocols.http --hidden-import uvicorn.protocols.http.auto --hidden-import uvicorn.lifespan --hidden-import uvicorn.lifespan.on main.py
          
      - name: Build with PyInstaller (Linux)
        if: runner.os == 'Linux'
        working-directory: server
        run: |
          # Use folder mode for Linux to avoid size limitations
          uv run pyinstaller --onedir --name esc-server --console --clean --noconfirm --add-data "data:data" --collect-all pydash --collect-all tzlocal --collect-all smarttel --hidden-import uvicorn.logging --hidden-import uvicorn.loops --hidden-import uvicorn.loops.auto --hidden-import uvicorn.protocols --hidden-import uvicorn.protocols.http --hidden-import uvicorn.protocols.http.auto --hidden-import uvicorn.lifespan --hidden-import uvicorn.lifespan.on main.py
          
      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        working-directory: server
        run: |
          uv run pyinstaller --onefile --name esc-server --console --clean --noconfirm --add-data "data;data" --collect-all pydash --collect-all tzlocal --collect-all smarttel --hidden-import uvicorn.logging --hidden-import uvicorn.loops --hidden-import uvicorn.loops.auto --hidden-import uvicorn.protocols --hidden-import uvicorn.protocols.http --hidden-import uvicorn.protocols.http.auto --hidden-import uvicorn.lifespan --hidden-import uvicorn.lifespan.on main.py
          
      - name: Create bundle directory
        run: |
          mkdir -p electron/python-bundle
          
      - name: Copy executable (macOS)
        if: runner.os == 'macOS'
        run: |
          cp server/dist/esc-server electron/python-bundle/
          chmod +x electron/python-bundle/esc-server
          
      - name: Copy executable folder (Linux)
        if: runner.os == 'Linux'
        run: |
          # For Linux, copy the entire dist folder contents
          cp -r server/dist/esc-server/* electron/python-bundle/
          chmod +x electron/python-bundle/esc-server
          # Create a launcher script for consistency
          echo '#!/bin/bash' > electron/python-bundle/esc-server-launcher
          echo 'DIR="$( cd "$( dirname "${BASH_SOURCE[0]}" )" && pwd )"' >> electron/python-bundle/esc-server-launcher
          echo '"$DIR/esc-server" "$@"' >> electron/python-bundle/esc-server-launcher
          chmod +x electron/python-bundle/esc-server-launcher
          
      - name: Copy executable (Windows)
        if: runner.os == 'Windows'
        run: |
          Copy-Item server\dist\esc-server.exe electron\python-bundle\
          
      - name: Upload Python bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: electron/python-bundle

  build-electron:
    name: Build Electron App
    needs: [build-ui, build-python]
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        include:
          - os: macos-latest
            platform: mac
            artifact: mac-build
            python-artifact: python-macos
          - os: windows-latest
            platform: win
            artifact: win-build
            python-artifact: python-windows
          - os: ubuntu-latest
            platform: linux
            artifact: linux-build
            python-artifact: python-linux
    
    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10
          
      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: ui/
          
      - name: Download Python bundle
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.python-artifact }}
          path: electron/python-bundle
          
      - name: Cache Electron dependencies
        uses: actions/cache@v4
        with:
          path: electron/node_modules
          key: ${{ runner.os }}-electron-${{ hashFiles('electron/pnpm-lock.yaml') }}
          
      - name: Install Electron dependencies
        working-directory: electron
        run: pnpm install --frozen-lockfile
        
      - name: Build for ${{ matrix.platform }}
        working-directory: electron
        run: pnpm run build:${{ matrix.platform }}
        
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: electron/dist/
          
  create-release:
    name: Create Release
    needs: build-electron
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Mac build
        uses: actions/download-artifact@v4
        with:
          name: mac-build
          path: dist/mac
          
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: win-build
          path: dist/win
          
      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: dist/linux
          
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: ${{ github.event.inputs.release_type == 'draft' }}
          prerelease: ${{ github.event.inputs.release_type == 'prerelease' }}
          files: |
            dist/mac/*.dmg
            dist/mac/*.zip
            dist/win/*.exe
            dist/linux/*.AppImage
          body: |
            ## ESC Release ${{ github.ref_name }}
            
            ### Installation
            
            **macOS:**
            - Download the `.dmg` file for your architecture
            - Open the DMG and drag ESC to Applications
            
            **Windows:**
            - Download the `.exe` installer
            - Run the installer and follow the prompts
            
            **Linux:**
            - Download the `.AppImage` file
            - Make it executable: `chmod +x ESC-*.AppImage`
            - Run it: `./ESC-*.AppImage`
            
            ### Changes
            See [CHANGELOG.md](CHANGELOG.md) for details.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}